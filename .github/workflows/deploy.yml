name: Deploy to Cloud Run Job

on:
  push:
    branches:
      - feature_branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Decode service account key
      run: echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > "${{ github.workspace }}/key.json"

    - name: Set up Docker auth manually for GCR
      run: |
        gcloud auth activate-service-account --key-file="${{ github.workspace }}/key.json"
        cat ${{ github.workspace }}/key.json | docker-credential-gcr configure-docker

    - name: Build Docker image
      run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcs-to-bq-job .

    - name: Push Docker image to GCR
      run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcs-to-bq-job
